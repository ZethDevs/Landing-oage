<!DOCTYPE html>
<html>
<head><title>Kunci Config</title>
<style>
#modal { display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; }
#box { background:#fff; padding:30px; border-radius:10px; }
</style>
</head>
<body>
<div id="modal"><div id="box">
<h2>Masukkan Key</h2>
<input id="key" placeholder="Key">
<button onclick="cek()">Buka</button>
<p id="msg"></p>
</div></div>
<script>
const enc = btoa("Nathanaeru");
function cek() {
  if (btoa(document.getElementById('key').value) === enc) {
    document.getElementById('msg').innerText = 'Akses diterima';
    document.getElementById('modal').style.display = 'none';
  } else {
    document.getElementById('msg').innerText = 'Kunci salah';
  }
}
</script>
</body>
</html>
